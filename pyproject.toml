[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "PL"]
ignore = ["PLR0913", "PLR0917", "PLC0415", "PLW0108"]

[tool.ruff.lint.per-file-ignores]
"popper_upgrade/tests/*" = ["PLR2004"]
"popper_upgrade/app/tabs/*" = ["PLR0915"]
"popper_upgrade/serving/vllm.py" = ["PLR0912", "PLR0915", "PLR2004"]

[tool.pytest.ini_options]
markers = [
    "db: tests that need a running database",
    "e2e: end-to-end tests that call real model endpoints",
]
addopts = "-m 'not db and not e2e'"
