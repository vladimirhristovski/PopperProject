services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: popper
      POSTGRES_PASSWORD: popper
      POSTGRES_DB: popper
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U popper -d popper"]
      interval: 2s
      timeout: 3s
      retries: 30
  app-tests:
    build:
      context: ..
      dockerfile: popper_upgrade/Dockerfile.app
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POPPER_DB_DSN: postgresql://popper:popper@postgres:5432/popper
    command: python -m pytest popper_upgrade/tests -m "db or e2e" -v
