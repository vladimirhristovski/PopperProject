name: Build Singularity Container
on:
  workflow_dispatch:
    inputs:
      target:
        description: Which image to build
        type: choice
        options:
          - baseline
          - upgrade
          - modern
          - qwen
        default: baseline
      base_revision:
        description: Commit of the base popper_llama.sif in the HF repo (upgrade only; auto = latest commit before 2026-09-18T19:00:32Z)
        type: string
        default: auto
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ inputs.target }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: ${{ inputs.target != 'upgrade' && inputs.target != 'modern' && inputs.target != 'qwen' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Apptainer
        run: |
          sudo apt-get update -y
          sudo apt-get install -y wget
          APPTAINER_VER="1.3.3"
          wget -q https://github.com/apptainer/apptainer/releases/download/v${APPTAINER_VER}/apptainer_${APPTAINER_VER}_amd64.deb
          echo "1a2e96cae9eaf54b069bd0107da590e60452e6d58430376c91058ad751497b59  apptainer_${APPTAINER_VER}_amd64.deb" | sha256sum -c -
          sudo dpkg -i apptainer_${APPTAINER_VER}_amd64.deb
          apptainer --version
      - name: Build SIF
        run: |
          sudo apptainer build popper_llama.sif baseline_experiment/popper_llama.def
          ls -lh popper_llama.sif
      - name: Upload SIF to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ secrets.HF_USERNAME }}
        run: |
          pip install -q huggingface_hub==2.3.0
          python3 -c "import os; from huggingface_hub import HfApi; token=os.environ['HF_TOKEN']; username=os.environ['HF_USERNAME']; repo_id=username+'/popper-llama-container'; api=HfApi(token=token); api.create_repo(repo_id=repo_id,repo_type='dataset',exist_ok=True,private=True); api.upload_file(path_or_fileobj='popper_llama.sif',path_in_repo='popper_llama.sif',repo_id=repo_id,repo_type='dataset'); print('Done!')"
  build-upgrade:
    if: ${{ inputs.target == 'upgrade' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /
      - name: Install Apptainer
        run: |
          sudo apt-get update -y
          sudo apt-get install -y wget
          APPTAINER_VER="1.3.3"
          wget -q https://github.com/apptainer/apptainer/releases/download/v${APPTAINER_VER}/apptainer_${APPTAINER_VER}_amd64.deb
          echo "1a2e96cae9eaf54b069bd0107da590e60452e6d58430376c91058ad751497b59  apptainer_${APPTAINER_VER}_amd64.deb" | sha256sum -c -
          sudo dpkg -i apptainer_${APPTAINER_VER}_amd64.deb
          apptainer --version
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Download base SIF
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ secrets.HF_USERNAME }}
        run: |
          pip install -q huggingface_hub==2.3.0
          python3 popper_upgrade/tools/fetch_base.py --revision "${{ inputs.base_revision }}"
          ls -lh popper_llama.sif
      - name: Prepare data
        run: |
          pip install -q datasets==5.1.0 requests==2.34.2 pandas==3.1.0
          python3 baseline_experiment/prepare_data.py
          python3 - <<'PY'
          import json
          import pandas as pd
          for dataset in json.load(open("popper_upgrade/registry/datasets.json")):
              rows = len(pd.read_csv(dataset["path"]))
              assert rows == dataset["schema"]["n_rows"], (dataset["name"], rows, dataset["schema"]["n_rows"])
              print(dataset["name"], rows, "rows OK")
          PY
      - name: Fetch DiscoveryBench
        run: |
          df -h /
          python3 popper_upgrade/tools/fetch_discoverybench.py --md5 175d0278e4293c67b41ab989f26c61b7 --size 2271481285 --archive "${RUNNER_TEMP}/popper_data_processed.tar.gz" --dest data/benchmark/discoverybench
          python3 popper_upgrade/tools/check_discoverybench.py data/benchmark/discoverybench
      - name: Check a job is baked in
        run: |
          ls cluster/jobs/*/job.json
          echo "${GITHUB_SHA}" > cluster/GIT_SHA
      - name: Build SIF
        run: |
          sudo apptainer build popper_upgrade.sif cluster/popper_upgrade.def
          ls -lh popper_upgrade.sif
      - name: Gate 1, proven packages unchanged
        run: |
          apptainer exec popper_llama.sif pip3 freeze > base_freeze.txt
          apptainer exec popper_upgrade.sif pip3 freeze > upgrade_freeze.txt
          python3 popper_upgrade/tools/freeze_diff.py base_freeze.txt upgrade_freeze.txt
      - name: Test SIF
        run: apptainer test popper_upgrade.sif
      - name: Gate 6, only the anchor job is baked in
        run: |
          apptainer exec popper_upgrade.sif ls /opt/popper/cluster/jobs | tee jobs.txt
          test "$(cat jobs.txt)" = "llama-anchor"
      - name: Gate 7, operator dry run
        run: |
          mkdir -p "${RUNNER_TEMP}/dryrun"
          cd "${RUNNER_TEMP}/dryrun"
          POPPER_FAKE_BACKEND=1 apptainer run "${GITHUB_WORKSPACE}/popper_upgrade.sif" --skip-preflight --replicates 1 | tee output.txt
          ARCHIVE=$(ls popper_results_*.tar.gz)
          tail -n 1 output.txt | grep -F "${ARCHIVE}"
          tar -tzf "${ARCHIVE}" | grep -E '/(manifest.json|summary.md|summary.csv|runs.jsonl)$'
          ls -la
      - name: Upload SIF to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ secrets.HF_USERNAME }}
        run: |
          pip install -q huggingface_hub==2.3.0
          python3 -c "import os; from huggingface_hub import HfApi; token=os.environ['HF_TOKEN']; username=os.environ['HF_USERNAME']; repo_id=username+'/popper-llama-container'; api=HfApi(token=token); api.create_repo(repo_id=repo_id,repo_type='dataset',exist_ok=True,private=True); api.upload_file(path_or_fileobj='popper_upgrade.sif',path_in_repo='popper_upgrade.sif',repo_id=repo_id,repo_type='dataset'); print('Done!')"
  build-modern:
    if: ${{ inputs.target == 'modern' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /
      - name: Install Apptainer
        run: |
          sudo apt-get update -y
          sudo apt-get install -y wget
          APPTAINER_VER="1.3.3"
          wget -q https://github.com/apptainer/apptainer/releases/download/v${APPTAINER_VER}/apptainer_${APPTAINER_VER}_amd64.deb
          echo "1a2e96cae9eaf54b069bd0107da590e60452e6d58430376c91058ad751497b59  apptainer_${APPTAINER_VER}_amd64.deb" | sha256sum -c -
          sudo dpkg -i apptainer_${APPTAINER_VER}_amd64.deb
          apptainer --version
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Prepare data
        run: |
          pip install -q datasets==5.1.0 requests==2.34.2 pandas==3.1.0
          python3 baseline_experiment/prepare_data.py
          python3 - <<'PY'
          import json
          import pandas as pd
          for dataset in json.load(open("popper_upgrade/registry/datasets.json")):
              rows = len(pd.read_csv(dataset["path"]))
              assert rows == dataset["schema"]["n_rows"], (dataset["name"], rows, dataset["schema"]["n_rows"])
              print(dataset["name"], rows, "rows OK")
          PY
      - name: Fetch DiscoveryBench
        run: |
          df -h /
          python3 popper_upgrade/tools/fetch_discoverybench.py --md5 175d0278e4293c67b41ab989f26c61b7 --size 2271481285 --archive "${RUNNER_TEMP}/popper_data_processed.tar.gz" --dest data/benchmark/discoverybench
          python3 popper_upgrade/tools/check_discoverybench.py data/benchmark/discoverybench
      - name: Check jobs are baked in
        run: |
          ls cluster/jobs/*/job.json
          echo "${GITHUB_SHA}" > cluster/GIT_SHA
      - name: Build SIF
        run: |
          sudo apptainer build popper_modern.sif cluster/popper_modern.def
          ls -lh popper_modern.sif
      - name: Gate 1, popper-env equals the proven pins
        run: |
          apptainer exec popper_modern.sif uv pip freeze --python /opt/popper-env/bin/python > modern_freeze.txt
          python3 popper_upgrade/tools/check_env.py popper_upgrade/requirements.txt modern_freeze.txt --popper-sha 59611864e09dd15d7528e240ad87c7ddbb4a701c
      - name: Test SIF
        run: apptainer test popper_modern.sif
      - name: Gate 6, only modern jobs are baked in
        run: |
          apptainer exec popper_modern.sif ls /opt/popper/cluster/jobs | tee jobs.txt
          test "$(wc -l < jobs.txt)" -eq 6
          ! grep -x llama-anchor jobs.txt
      - name: Gate 7, operator dry run
        run: |
          mkdir -p "${RUNNER_TEMP}/dryrun"
          cd "${RUNNER_TEMP}/dryrun"
          POPPER_FAKE_BACKEND=1 apptainer run "${GITHUB_WORKSPACE}/popper_modern.sif" llama-small --skip-preflight --replicates 1 | tee output.txt
          ARCHIVE=$(ls popper_results_*.tar.gz)
          tail -n 1 output.txt | grep -F "${ARCHIVE}"
          tar -tzf "${ARCHIVE}" | grep -E '/(manifest.json|summary.md|summary.csv|runs.jsonl|freeze.json)$'
          ls -la
      - name: Upload SIF to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ secrets.HF_USERNAME }}
        run: |
          pip install -q huggingface_hub==2.3.0
          python3 -c "import os; from huggingface_hub import HfApi; token=os.environ['HF_TOKEN']; username=os.environ['HF_USERNAME']; repo_id=username+'/popper-llama-container'; api=HfApi(token=token); api.create_repo(repo_id=repo_id,repo_type='dataset',exist_ok=True,private=True); api.upload_file(path_or_fileobj='popper_modern.sif',path_in_repo='popper_modern.sif',repo_id=repo_id,repo_type='dataset'); print('Done!')"
  build-qwen:
    if: ${{ inputs.target == 'qwen' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /
      - name: Install Apptainer
        run: |
          sudo apt-get update -y
          sudo apt-get install -y wget
          APPTAINER_VER="1.3.3"
          wget -q https://github.com/apptainer/apptainer/releases/download/v${APPTAINER_VER}/apptainer_${APPTAINER_VER}_amd64.deb
          echo "1a2e96cae9eaf54b069bd0107da590e60452e6d58430376c91058ad751497b59  apptainer_${APPTAINER_VER}_amd64.deb" | sha256sum -c -
          sudo dpkg -i apptainer_${APPTAINER_VER}_amd64.deb
          apptainer --version
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Prepare data
        run: |
          pip install -q datasets==5.1.0 requests==2.34.2 pandas==3.1.0
          python3 baseline_experiment/prepare_data.py
          python3 - <<'PY'
          import json
          import pandas as pd
          for dataset in json.load(open("popper_upgrade/registry/datasets.json")):
              rows = len(pd.read_csv(dataset["path"]))
              assert rows == dataset["schema"]["n_rows"], (dataset["name"], rows, dataset["schema"]["n_rows"])
              print(dataset["name"], rows, "rows OK")
          PY
      - name: Check a job is baked in
        run: |
          ls cluster/jobs/qwen-large/job.json
          echo "${GITHUB_SHA}" > cluster/GIT_SHA
      - name: Build SIF
        run: |
          sudo apptainer build popper_qwen.sif cluster/popper_qwen.def
          ls -lh popper_qwen.sif
      - name: Gate 1, popper-env equals the proven pins
        run: |
          apptainer exec popper_qwen.sif uv pip freeze --python /opt/popper-env/bin/python > qwen_freeze.txt
          python3 popper_upgrade/tools/check_env.py popper_upgrade/requirements.txt qwen_freeze.txt --popper-sha 59611864e09dd15d7528e240ad87c7ddbb4a701c
      - name: Gate 2, vLLM env equals the constraints file
        run: |
          apptainer exec popper_qwen.sif uv pip freeze --python /opt/vllm-env/bin/python > qwen_vllm_freeze.txt
          diff <(sort popper_upgrade/constraints-vllm-env.txt) <(sort qwen_vllm_freeze.txt)
      - name: Test SIF
        run: apptainer test popper_qwen.sif
      - name: Gate 3, vLLM serves the thinking-off flag
        run: |
          apptainer exec popper_qwen.sif /opt/vllm-env/bin/python - <<'PY'
          import argparse
          from vllm.entrypoints.openai.cli_args import FrontendArgs
          parser = argparse.ArgumentParser()
          FrontendArgs.add_cli_args(parser)
          flags = [option for action in parser._actions for option in action.option_strings]
          assert "--default-chat-template-kwargs" in flags, flags
          print("--default-chat-template-kwargs OK")
          PY
      - name: Gate 4, driver floor is 525.60
        run: |
          apptainer exec popper_qwen.sif /opt/popper-env/bin/python -c "from cluster.preflight import DRIVER_FLOORS; assert DRIVER_FLOORS['qwen'] == ('popper_qwen.sif', (525, 60)), DRIVER_FLOORS; print('qwen driver floor 525.60 OK')"
      - name: Gate 6, only the qwen job is baked in
        run: |
          apptainer exec popper_qwen.sif ls /opt/popper/cluster/jobs | tee jobs.txt
          test "$(cat jobs.txt)" = "qwen-large"
      - name: Gate 7, operator dry run
        run: |
          mkdir -p "${RUNNER_TEMP}/dryrun"
          cd "${RUNNER_TEMP}/dryrun"
          POPPER_FAKE_BACKEND=1 apptainer run "${GITHUB_WORKSPACE}/popper_qwen.sif" --skip-preflight --replicates 1 | tee output.txt
          ARCHIVE=$(ls popper_results_*.tar.gz)
          tail -n 1 output.txt | grep -F "${ARCHIVE}"
          tar -tzf "${ARCHIVE}" | grep -E '/(manifest.json|summary.md|summary.csv|runs.jsonl|freeze.json)$'
          ls -la
      - name: Gate 8, canary entrypoint in fake mode
        run: |
          mkdir -p "${RUNNER_TEMP}/canary"
          cd "${RUNNER_TEMP}/canary"
          POPPER_FAKE_BACKEND=1 apptainer run "${GITHUB_WORKSPACE}/popper_qwen.sif" canary | tee output.txt
          tail -n 1 output.txt | grep -F "PASS — run: singularity run --nv popper_qwen.sif"
          python3 -c "import json; d = json.load(open('canary.json')); assert d['verdict'] == 'PASS' and d['fake_backend'], d"
          ls -la
      - name: Upload SIF to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ secrets.HF_USERNAME }}
        run: |
          pip install -q huggingface_hub==2.3.0
          python3 -c "import os; from huggingface_hub import HfApi; token=os.environ['HF_TOKEN']; username=os.environ['HF_USERNAME']; repo_id=username+'/popper-llama-container'; api=HfApi(token=token); api.create_repo(repo_id=repo_id,repo_type='dataset',exist_ok=True,private=True); api.upload_file(path_or_fileobj='popper_qwen.sif',path_in_repo='popper_qwen.sif',repo_id=repo_id,repo_type='dataset'); print('Done!')"
